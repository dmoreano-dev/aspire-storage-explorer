name: Release

# Runs when a tag such as v0.1.0 is pushed. Checks everything first, then publishes the image and then the package,
# so the package never points to a missing image.
#
# The image goes to ghcr.io with the workflow token. The package goes to nuget.org with Trusted Publishing
#
# First release: a new ghcr.io package is private, so "Check the image is public" fails. Make it public (profile >
# Packages > storage-explorer > Package settings > Change visibility) and re-run. Nothing has reached nuget.org yet.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  packages: write # push the image to ghcr.io
  id-token: write # get a temporary nuget.org API key

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag against the code
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          hosting=src/StorageExplorer.Aspire.Hosting
          project_version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' "$hosting/StorageExplorer.Aspire.Hosting.csproj")
          tags_file="$hosting/StorageExplorerContainerImageTags.cs"
          registry=$(sed -n 's|.*Registry = "\(.*\)";.*|\1|p' "$tags_file")
          image=$(sed -n 's|.*const string Image = "\(.*\)";.*|\1|p' "$tags_file")
          image_tag=$(sed -n 's|.*const string Tag = "\(.*\)";.*|\1|p' "$tags_file")
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')

          fail() { echo "::error::$1"; exit 1; }

          [ "$project_version" = "$version" ] || fail "Tag $GITHUB_REF_NAME does not match <Version> $project_version in the csproj."
          [ "$image_tag" = "$version" ] || fail "Tag $GITHUB_REF_NAME does not match the image Tag $image_tag in StorageExplorerContainerImageTags.cs."
          [ "$registry" = "ghcr.io" ] || fail "Registry in StorageExplorerContainerImageTags.cs must be \"ghcr.io\"."
          [[ "$image" == "$owner"/* ]] || fail "The image '$image' must live under '$owner/' (the owner of this repository, in lowercase)."
          [ "$image" = "$(echo "$image" | tr '[:upper:]' '[:lower:]')" ] || fail "The image '$image' must be all lowercase."

          # Release notes: this version's CHANGELOG section.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || fail "CHANGELOG.md has no '## [$version]' section."

          # A version with a suffix (0.2.0-rc.1) is a pre-release: no `latest` tag.
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi

          {
            echo "version=$version"
            echo "image=$registry/$image"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/StorageExplorer.Web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prerelease == 'false' && format('{0}:latest', steps.meta.outputs.image) || '' }}

      # A new ghcr.io package is private, but users pull without logging in. Check before publishing the package.
      - name: Check the image is public
        run: |
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" > /dev/null; then
            echo "::error::The image cannot be pulled without logging in. Make the package public (see the note at the top of this workflow) and re-run the workflow."
            exit 1
          fi

      - name: Pack
        run: >
          dotnet pack src/StorageExplorer.Aspire.Hosting
          --configuration Release
          --output artifacts
          -p:ContinuousIntegrationBuild=true
          -p:PackageProjectUrl=${{ github.server_url }}/${{ github.repository }}

      # Right before the push: the key expires after one hour and the image build is slow.
      - name: Get a temporary nuget.org API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish the package to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${flags[@]}"
